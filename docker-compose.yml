version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: medibridge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medibridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medibridge_pass}
      POSTGRES_DB: ${POSTGRES_DB:-medibridge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medibridge_pgdata:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medibridge} -d ${POSTGRES_DB:-medibridge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medibridge_pgdata:
